<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>TikTok Plus 评论翻译测试</title>
<style>
  :root { color-scheme: light dark; --ui-text-1: CanvasText; --ui-text-2: CanvasText; }
  body { max-width: 900px; margin: 32px auto; padding: 0 20px; font: 15px/1.6 system-ui; }
  article { padding: 12px; margin: 8px 0; border: 1px solid GrayText; }
  #results { white-space: pre-wrap; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #fullscreen { position: fixed; top: 132px; right: 12px; }
  #next-video { position: fixed; top: 164px; right: 12px; }
  #previous-video { position: fixed; top: 196px; right: 12px; }
  /* Mirror TikTok's app shell: one full-viewport flex row holding the scrollable column list
     and the right rail, so cinema-mode centering behaves like the real page. */
  #content { position: fixed; inset: 0; display: flex; width: 100vw; height: 100vh; }
  #right-panel { flex: 0 0 320px; width: 320px; height: 100%; background: Canvas; }
  #right-panel[hidden] { display: none; }
  #column-list-container { flex: 1 1 auto; min-width: 0; height: 100%; overflow: auto; }
  #column-list-container article { height: max(900px, calc(100vh - 100px)); min-height: max(900px, calc(100vh - 100px)); }
  [data-e2e="feed-video"] { position: relative; width: 400px; height: 820px; border-radius: 16px; overflow: hidden; }
  .DivVideoPlayerContainer { position: relative; width: 400px; height: 820px; }
  .DivMediaCardOverlayTop { position: absolute; top: 8px; right: 8px; z-index: 3; }
  .DivMediaCardOverlayBottom { position: absolute; bottom: 8px; left: 8px; z-index: 3; }
  .SectionActionBarContainer { color: var(--ui-text-1); }
  .SectionActionBarContainer svg { width: 24px; height: 24px; }
  #like-icon svg { color: rgb(22, 24, 35); fill: currentColor; }
  #like-icon strong { color: rgb(22, 24, 35); }
  .DivContentFlexLayout { display: flex; gap: 16px; height: 100%; justify-content: center; align-items: center; }
  #bulk-panel { position: fixed; top: 250px; right: 12px; width: 420px; max-height: 480px; overflow: auto; background: Canvas; border: 1px solid GrayText; }
  #bulk-panel [class="DivCommentHeader"] { display: flex; align-items: center; padding: 8px; }
</style>
<h1>TikTok Plus 评论翻译测试</h1>
<p>自动检查，使用模拟请求，不连接 Google。刷新可重新运行。</p>
<pre id="results" role="status">运行中…</pre>
<div id="comments">
  <article id="initial"><div data-e2e="comment-username-1"><a href="/@example">Example</a></div><span data-e2e="comment-level-1">Hello <a href="/@friend">@friend</a> 😭</span><img alt="照片"><div><button data-e2e="comment-reply-1">回复</button></div></article>
</div>
<section id="bulk-panel" class="SectionCommentSidebarContainer" hidden>
  <div class="DivCommentHeader"><span>评论</span><div class="DivCloseButtonWrapper"><button aria-label="exit">×</button></div></div>
  <div id="bulk-comments"></div>
</section>
<!-- Mirrors TikTok's real tree: cards live inside a scrollable column list, each card is an
     article whose flex row holds the media card and the action bar as siblings, and the
     more-menu popover is portalled outside all of it. -->
<div id="content">
<div id="column-list-container" class="DivColumnListContainer">
  <article class="ArticleItemContainer" id="video-article">
    <div id="media-card-row" class="DivContentFlexLayout">
      <section id="player-card" data-e2e="feed-video" aria-label="Watch in full screen">
        <div class="DivVideoPlayerContainer"><video></video></div>
        <div class="DivMediaCardOverlayTop">
          <button data-e2e="more-menu-icon" id="more-menu" aria-haspopup="dialog">⋯</button>
        </div>
        <div class="DivMediaCardOverlayBottom" id="video-info">作者信息</div>
      </section>
      <section class="SectionActionBarContainer" id="action-bar">
        <div role="button" tabindex="0" data-e2e="like-icon" id="like-icon" aria-pressed="false"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 2h20v20H2z"/></svg><strong data-e2e="like-count">284.5K</strong></div>
        <div role="button" tabindex="0" data-e2e="comment-icon" id="comment-icon"><svg viewBox="0 0 24 24" style="fill: rgba(22, 24, 35, 0.9)"><path d="M2 2h20v20H2z"/></svg><strong style="color:rgb(22,24,35)">268</strong></div>
        <div role="button" tabindex="0" data-e2e="favorite-icon" id="favorite-icon"><svg viewBox="0 0 24 24"><path fill="none" stroke="rgb(22,24,35)" stroke-width="2" d="M2 2h20v20H2z"/></svg><strong data-e2e="favorite-count">6511</strong></div>
      </section>
    </div>
  </article>
</div>
<aside id="right-panel" class="AsideOneColumnSidebar" hidden></aside>
<aside id="navigation-sidebar" class="AsideNavigation">导航</aside>
</div>
<div id="popover-portal"></div>
<button data-e2e="cinema-mode-entry" id="fullscreen">全屏</button>
<button aria-label="Next" id="next-video">下一个</button>
<button aria-label="Previous" id="previous-video">上一个</button>
<textarea aria-label="评论输入框"></textarea>
<script>
  const requests = [];
  window.GM_xmlhttpRequest = request => {
    request.startedAt = performance.now();
    requests.push(request);
    return { abort() { request.aborted = true; } };
  };
  window.__tiktokRequests = requests;
  const storage = new Map();
  const seedKey = JSON.stringify(["google:dict-chrome-ex:v1", "zh-CN", "Previously translated"]);
  storage.set("tiktok-plus:dict-chrome-ex:v1",
    [[seedKey, { text: "已有缓存译文", expires: Date.now() + 86400000 }]]);
  window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
  window.GM_setValue = (key, value) => storage.set(key, value);
  // Privileged userscripts expose a wrapped window that cannot be used as UIEvent.view.
  const NativeMouseEvent = MouseEvent;
  window.MouseEvent = class extends NativeMouseEvent {
    constructor(type, options = {}) {
      const init = { ...options };
      if (init.view === window) init.view = new Proxy(window, {});
      super(type, init);
    }
  };
  // TikTok's media card is labelled "Watch in full screen" but only toggles playback, so the
  // harness reproduces it to prove the shortcut never treats the card as a fullscreen control.
  window.__cardClicks = 0;
  document.querySelector("#player-card").addEventListener("click", () => window.__cardClicks++);
  // The real more-menu popover is teleported outside the media card, which is exactly why it
  // stayed invisible back when only the card was fullscreened. Reproduce that topology here.
  const portal = document.querySelector("#popover-portal");
  const moreMenu = document.querySelector("#more-menu");
  let popover = null;
  moreMenu.addEventListener("click", () => {
    if (popover) { popover.remove(); popover = null; return; }
    popover = document.createElement("div");
    popover.className = "TUXPopover-popover TUXPopover-popover--open";
    popover.setAttribute("data-e2e", "more-menu-popover");
    popover.setAttribute("role", "dialog");
    popover.style.cssText = "position:absolute;z-index:4000;left:0;top:0;width:200px;height:100px;";
    popover.innerHTML = '<button type="button" data-e2e="more-menu-popover_speed-flat-1.5">1.5</button>';
    popover.addEventListener("click", event => {
      if (event.target.closest('[data-e2e="more-menu-popover_speed-flat-1.5"]')) {
        window.__userRate = 1.5;
      }
    });
    portal.appendChild(popover);
  });
  window.__popover = () => popover;
  window.__userRate = 1;
  // Opening comments mounts the right rail the same way TikTok does.
  document.querySelector("#comment-icon").addEventListener("click", () => {
    const panel = document.querySelector("#right-panel");
    panel.hidden = !panel.hidden;
    let list = panel.querySelector(".DivCommentListContainer");
    if (!panel.hidden && !list) {
      panel.innerHTML = '<div class="DivCommentSidebarTransitionWrapper"><section class="SectionCommentSidebarContainer"><button id="close-comments">关闭评论</button><div class="DivCommentListContainer">评论内容</div></section></div>';
      panel.querySelector("#close-comments").addEventListener("click", () => {
        document.querySelector("#comment-icon").click();
      });
    }
    panel.querySelectorAll(".DivCommentListContainer").forEach(node => {
      node.hidden = panel.hidden;
    });
  });
  // Fake the Fullscreen API so request/exit behaviour is asserted deterministically.
  const fullscreenCalls = [];
  let fakeFullscreenElement = null;
  Object.defineProperty(document, "fullscreenElement", { configurable: true, get: () => fakeFullscreenElement });
  Object.defineProperty(document, "exitFullscreen", {
    configurable: true,
    value: () => {
      fullscreenCalls.push("exit");
      fakeFullscreenElement = null;
      document.dispatchEvent(new Event("fullscreenchange"));
      return Promise.resolve();
    },
  });
  Element.prototype.requestFullscreen = function () {
    fullscreenCalls.push(this);
    if (window.__denyFullscreen) return Promise.reject(new TypeError("Fullscreen request denied"));
    fakeFullscreenElement = this;
    document.dispatchEvent(new Event("fullscreenchange"));
    return Promise.resolve();
  };
  // Browsers drop fullscreen on their own (Escape, OS gesture) without calling exitFullscreen.
  window.__browserExit = () => {
    fakeFullscreenElement = null;
    document.dispatchEvent(new Event("fullscreenchange"));
  };
  window.__fullscreenCalls = fullscreenCalls;
</script>
<script src="../tiktok_plus.js?v=1.5.3"></script>
<script>
  (async () => {
    const output = document.querySelector("#results");
    const passed = [];
    const requests = window.__tiktokRequests;
    const flush = () => new Promise(resolve => setTimeout(resolve, 0));
    // Cinema layout runs inside requestAnimationFrame, so effects land one frame later.
    const frames = (count = 2) => new Promise(resolve => {
      const tick = () => (count-- <= 0 ? resolve() : requestAnimationFrame(tick));
      requestAnimationFrame(tick);
    });
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const until = async (predicate, seconds = 5) => {
      const deadline = performance.now() + seconds * 1000;
      while (!predicate()) {
        if (performance.now() >= deadline) throw new Error("等待状态超时");
        await wait(20);
      }
    };
    const check = (name, condition) => {
      if (!condition) throw new Error(name);
      passed.push("✓ " + name);
      output.textContent = passed.join("\n");
    };
    const buttonFor = element => element.parentElement.querySelector(".tiktok-plus-translate-button");
    const translated = element => element.parentElement.querySelector(".tiktok-plus-comment-translation");
    const requestText = request => new URL(request.url).searchParams.get("q");
    const respond = (request, value, status = 200) => request.onload({
      status, responseHeaders: "", responseText: JSON.stringify([[value]]),
    });
    const makeComment = (text, target = document.querySelector("#comments"), level = 1) => {
      const row = document.createElement("article");
      const user = document.createElement("div");
      user.dataset.e2e = "comment-username-" + level;
      const anchor = document.createElement("a");
      anchor.href = "/@example"; anchor.textContent = "Example"; user.append(anchor);
      const element = document.createElement("span");
      element.dataset.e2e = "comment-level-" + level;
      element.textContent = text;
      row.append(user, element); target.append(row);
      return element;
    };
    const key = (target, code, value) => {
      const event = new KeyboardEvent("keydown", { code, key: value, bubbles: true, cancelable: true });
      target.dispatchEvent(event); return event;
    };
    try {
      const initial = document.querySelector('#initial [data-e2e="comment-level-1"]');
      const originalLink = initial.querySelector("a");
      const initialButton = buttonFor(initial);
      check("安装脚本不自动发送翻译请求", requests.length === 0);
      check("每条评论仅注入一个翻译按钮", !!initialButton &&
        initial.parentElement.querySelectorAll(".tiktok-plus-translate-button").length === 1);
      initialButton.click();
      check("手动翻译立即派发一个请求", requests.length === 1 && initialButton.disabled);
      const googleUrl = new URL(requests[0].url);
      check("与 Forum Translator 使用相同的 Google 接口", googleUrl.pathname === "/translate_a/t" &&
        googleUrl.searchParams.get("client") === "dict-chrome-ex" &&
        googleUrl.searchParams.get("tl") === "zh-CN" && requests[0].anonymous === true &&
        requests[0].timeout === 25000);
      respond(requests[0], "你好 @friend 😭");
      await flush();
      check("翻译后原文可恢复且保留原生链接", translated(initial).textContent === "你好 @friend 😭" &&
        initial.classList.contains("tiktok-plus-original-hidden"));
      initialButton.click();
      check("恢复原文后原生链接依旧可用", !initial.classList.contains("tiktok-plus-original-hidden") &&
        initial.querySelector("a") === originalLink);
      initialButton.click();
      check("重复切换译文不再次请求", requests.length === 1 && !translated(initial).hidden);

      const cached = makeComment("Previously translated");
      await flush();
      const beforeCache = requests.length;
      buttonFor(cached).click();
      await flush();
      check("启动时加载 30 天持久化缓存", translated(cached).textContent === "已有缓存译文" &&
        requests.length === beforeCache);
      const sameA = makeComment("Identical comment with duplicate requester");
      const sameB = makeComment("Identical comment with duplicate requester");
      await flush();
      const beforeDedup = requests.length;
      buttonFor(sameA).click(); buttonFor(sameB).click();
      check("两个独立评论共享同一网络请求", requests.length === beforeDedup + 1);
      respond(requests.at(-1), "复用同一个请求");
      await flush();
      check("请求去重仍分别更新两个评论", !translated(sameA).hidden && !translated(sameB).hidden);

      const longText = "A".repeat(899) + "😀" + "B".repeat(950);
      const longComment = makeComment(longText);
      await flush();
      const longStart = requests.length;
      buttonFor(longComment).click();
      check("超过900字符拆分为3个请求", requests.length === longStart + 3 &&
        requests.slice(longStart).every(request => requestText(request).length <= 900));
      check("分段边界不会截断Emoji", requests.slice(longStart).some(request =>
        requestText(request).includes("😀")) &&
        requests.slice(longStart).every(request => !requestText(request).includes("�")));
      for (let i = longStart; i < requests.length; i++) respond(requests[i], "译文块" + (i - longStart));
      await flush();
      check("分段结果拼接回同一条评论", translated(longComment).textContent === "译文块0译文块1译文块2");

      const emoji = makeComment("🤩🔥");
      await flush();
      check("纯表情评论不会注入翻译入口", !buttonFor(emoji));
      const injection = makeComment("Return dangerous HTML");
      await flush();
      buttonFor(injection).click();
      respond(requests.at(-1), '<img src=x onerror="alert(1)">');
      await flush();
      check("译文按文本渲染，不执行 HTML", translated(injection).children.length === 0);

      const calls = window.__fullscreenCalls;
      const card = document.querySelector("#player-card");
      const bar = document.querySelector("#action-bar");
      const root = document.documentElement;
      const popover = () => document.querySelector('[data-e2e="more-menu-popover"]');
      const cinemaOn = () => root.classList.contains("tiktok-plus-cinema-mode");
      const reveal = () => document.dispatchEvent(new Event("pointermove", { bubbles: true }));
      let fullscreenControlClicks = 0;
      document.querySelector("#fullscreen").addEventListener("click", () => fullscreenControlClicks++);
      const clickedControl = () => window.__cardClicks === 0 && fullscreenControlClicks === 0;

      // The idle timer keeps the chrome up while the video is paused, so simulate playback.
      Object.defineProperty(document.querySelector("#player-card video"), "paused",
        { configurable: true, get: () => false });
      Object.defineProperty(document.querySelector("#player-card video"), "videoWidth",
        { configurable: true, get: () => 1080 });
      Object.defineProperty(document.querySelector("#player-card video"), "videoHeight",
        { configurable: true, get: () => 1920 });

      const feed = document.querySelector("#column-list-container");
      const article = document.querySelector("#video-article");
      const makeFeedItem = (width, height) => {
        const item = article.cloneNode(true);
        item.removeAttribute("id");
        item.querySelectorAll("[id]").forEach(node => node.removeAttribute("id"));
        // A different player variant puts the hook on the video, not the outer card.
        item.querySelector('[data-e2e="feed-video"]').removeAttribute("data-e2e");
        const video = item.querySelector("video");
        video.setAttribute("data-e2e", "feed-video");
        Object.defineProperties(video, {
          videoWidth: { configurable: true, get: () => width },
          videoHeight: { configurable: true, get: () => height },
          paused: { configurable: true, get: () => false },
        });
        return item;
      };
      const previous = makeFeedItem(1080, 1920);
      const next = makeFeedItem(1920, 1080);
      feed.prepend(previous);
      feed.append(next);
      feed.scrollTop += article.getBoundingClientRect().top - feed.getBoundingClientRect().top;
      await frames();

      key(document.body, "KeyF", "f");
      await flush();
      check("F 让整个文档进入全屏而非单个播放器卡片", calls.length === 1 && calls[0] === root &&
        document.fullscreenElement === root);
      check("卡片与工具栏都进入影院布局", cinemaOn() && card.classList.contains("tiktok-plus-cinema-card") &&
        bar.classList.contains("tiktok-plus-cinema-bar"));
      check("卡片保持文档流布局以保证菜单定位", (() => {
        // TikTok positions the popover from the button's flow coordinates, so the card must not
        // be taken out of flow.
        const position = getComputedStyle(card).position;
        return position !== "fixed" && position !== "absolute";
      })());
      check("文章与弹性行加影院标记", document.querySelector("#video-article")
        .classList.contains("tiktok-plus-cinema-article") &&
        document.querySelector("#media-card-row").classList.contains("tiktok-plus-cinema-flex"));
      check("进入全屏不点击媒体卡片或旧影院控件", clickedControl());
      check("工具栏位于全屏子树内", root.contains(bar) && document.fullscreenElement.contains(bar));
      check("卡片按视频比例居中并扣除工具栏宽度", (() => {
        const cardRect = card.getBoundingClientRect();
        const barRect = bar.getBoundingClientRect();
        const expectedRatio = 1080 / 1920;
        const ratioOk = Math.abs(cardRect.width / cardRect.height - expectedRatio) < 0.02;
        const gapOk = barRect.left >= cardRect.right;
        return ratioOk && gapOk && cardRect.width > 1 && cardRect.height > 1;
      })());
      check("视频与内层播放器完整落在视口内", (() => {
        const videoRect = card.querySelector("video").getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();
        return videoRect.top >= 0 && videoRect.bottom <= innerHeight &&
          Math.abs(videoRect.width - cardRect.width) <= 1 &&
          Math.abs(videoRect.height - cardRect.height) <= 1 &&
          getComputedStyle(card.querySelector("video")).objectFit === "contain";
      })());
      check("从信息流中间进入时各视频占一屏且当前条目对齐", [previous, article, next].every(item =>
        Math.abs(item.getBoundingClientRect().height - innerHeight) <= 1) &&
        Math.abs(article.getBoundingClientRect().top) <= 1 &&
        previous.getBoundingClientRect().bottom <= 1 && next.getBoundingClientRect().top >= innerHeight - 1);
      check("黑底工具栏文字与默认图标保持高对比度", getComputedStyle(bar).color === "rgb(255, 255, 255)" &&
        getComputedStyle(bar.querySelector("path")).fill === "rgb(255, 255, 255)");
      check("图标独立行内填色和描边也保持可见", getComputedStyle(bar.querySelector("#comment-icon path")).fill === "rgb(255, 255, 255)" &&
        getComputedStyle(bar.querySelector("#favorite-icon path")).stroke === "rgb(255, 255, 255)" &&
        getComputedStyle(bar.querySelector("#favorite-icon path")).fill === "none");
      check("带独立颜色的计数显示为白色", [...bar.querySelectorAll("strong")].every(node =>
        getComputedStyle(node).color === "rgb(255, 255, 255)"));
      const likePath = bar.querySelector("path");
      likePath.setAttribute("fill", "#fe2c55");
      await frames();
      check("影院样式不覆盖已点赞的红色图标", getComputedStyle(likePath).fill === "rgb(254, 44, 85)");
      const favoritePath = bar.querySelector("#favorite-icon path");
      favoritePath.setAttribute("fill", "#face15");
      await frames();
      check("影院样式不覆盖已收藏的黄色图标", getComputedStyle(favoritePath).fill === "rgb(250, 206, 21)");
      favoritePath.setAttribute("fill", "none");
      likePath.setAttribute("fill", "currentColor");
      await frames();
      check("取消点赞后图标恢复为可见白色", getComputedStyle(likePath).fill === "rgb(255, 255, 255)");
      const likeSvg = likePath.closest("svg");
      likeSvg.style.setProperty("color", "rgb(254, 44, 85)");
      await frames();
      check("站点更新行内状态色时不会被旧样式覆盖", getComputedStyle(likePath).fill === "rgb(254, 44, 85)");
      likeSvg.style.removeProperty("color");
      await frames();
      check("恢复默认状态色后重新提亮", getComputedStyle(likePath).fill === "rgb(255, 255, 255)");
      const transparentPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      transparentPath.setAttribute("fill", "rgba(0, 0, 0, 0)");
      likeSvg.appendChild(transparentPath);
      await frames();
      check("透明图层不会被填白", getComputedStyle(transparentPath).fill === "rgba(0, 0, 0, 0)");
      const commentSvg = bar.querySelector("#comment-icon svg");
      commentSvg.style.marginLeft = "2px";
      check("菜单按钮与工具栏可被鼠标实际命中", [document.querySelector("#more-menu"), bar.querySelector('[data-e2e="like-icon"]')].every(element => {
        const rect = element.getBoundingClientRect();
        const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
        return hit === element || element.contains(hit);
      }));

      // The portalled popover is the regression this change exists for: it lived outside the
      // card's fullscreen subtree, so it rendered nowhere and swallowed clicks.
      document.querySelector("#more-menu").click();
      await flush();
      check("「⋯」菜单被传送到卡片子树之外（复现原始缺陷结构）", !!popover() && !card.contains(popover()));
      check("全屏时菜单弹层仍在全屏子树内", root.contains(popover()));
      check("全屏时菜单项可被真实命中", (() => {
        const item = popover().querySelector('[data-e2e="more-menu-popover_speed-flat-1.5"]');
        const box = item.getBoundingClientRect();
        // elementFromPoint proves paint + hit-testing, unlike .click() which works even when
        // the node is invisible outside the fullscreen subtree.
        const hit = document.elementFromPoint(box.left + box.width / 2, box.top + box.height / 2);
        return !!hit && (hit === item || item.contains(hit));
      })());
      check("菜单打开期间不进入闲置隐藏", await (async () => {
        await wait(3000);
        return !root.classList.contains("tiktok-plus-cinema-mode-idle");
      })());
      document.querySelector("#more-menu").click();
      await flush();
      check("再次点击「⋯」关闭菜单", !popover());

      reveal();
      let idleReached = false;
      await until(() => root.classList.contains("tiktok-plus-cinema-mode-idle"), 8).then(() => { idleReached = true; }, () => {});
      await frames(20);
      check("闲置后自动隐藏信息浮层与工具栏", idleReached &&
        Number(getComputedStyle(document.querySelector("#video-info")).opacity) === 0 &&
        Number(getComputedStyle(bar).opacity) === 0);
      key(document.body, "ArrowRight", "ArrowRight");
      check("快进快捷键也会恢复控件", !root.classList.contains("tiktok-plus-cinema-mode-idle"));
      reveal();
      await frames(2);
      check("鼠标活动后立即恢复显示", !root.classList.contains("tiktok-plus-cinema-mode-idle"));

      for (const railClass of ["AsideOneColumnSidebar", "RightPanelContainer"]) {
        const rail = document.querySelector("#right-panel");
        rail.className = railClass;
        for (const trigger of ["click", "KeyX"]) {
          if (trigger === "click") document.querySelector("#comment-icon").click();
          else key(document.body, "KeyX", "x");
          await frames(6);
          check(`${railClass} ${trigger} 打开评论后扣除右侧栏宽度重新居中`, (() => {
            const cardRect = card.getBoundingClientRect();
            const barRect = bar.getBoundingClientRect();
            const railWidth = rail.getBoundingClientRect().width;
            const freeCenter = (window.innerWidth - railWidth) / 2;
            const groupCenter = (cardRect.left + barRect.right) / 2;
            return root.classList.contains("tiktok-plus-cinema-mode-comments") &&
              railWidth > 0 && Math.abs(groupCenter - freeCenter) <= 2;
          })());
          const close = rail.querySelector("#close-comments");
          const rect = close.getBoundingClientRect();
          const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
          check(`${railClass} ${trigger} 评论栏可见且关闭按钮可被鼠标命中`,
            !!hit && (hit === close || close.contains(hit)));
          check("全屏打开评论时导航侧栏仍隐藏", getComputedStyle(document.querySelector("#navigation-sidebar")).display === "none");
          close.click();
          await frames(6);
          check(`${railClass} ${trigger} 关闭评论后恢复全宽居中`, (() => {
            const cardRect = card.getBoundingClientRect();
            const barRect = bar.getBoundingClientRect();
            const groupCenter = (cardRect.left + barRect.right) / 2;
            return !root.classList.contains("tiktok-plus-cinema-mode-comments") &&
              Math.abs(groupCenter - window.innerWidth / 2) <= 2;
          })());
        }
      }

      document.querySelector("#next-video").hidden = true;
      document.querySelector("#previous-video").hidden = true;
      key(document.body, "ArrowDown", "ArrowDown");
      await until(() => Math.abs(next.getBoundingClientRect().top) <= 1 &&
        !!next.querySelector(".tiktok-plus-cinema-card"));
      check("向下切视频后只显示目标条目", article.getBoundingClientRect().bottom <= 1 &&
        Math.abs(next.getBoundingClientRect().height - innerHeight) <= 1);
      check("横屏视频及内层播放器完整显示且比例正确", (() => {
        const rect = next.querySelector("video").getBoundingClientRect();
        return rect.top >= 0 && rect.bottom <= innerHeight &&
          rect.left >= 0 && rect.right <= innerWidth && Math.abs(rect.width / rect.height - 16 / 9) < 0.02;
      })());
      key(document.body, "ArrowUp", "ArrowUp");
      await until(() => Math.abs(article.getBoundingClientRect().top) <= 1 &&
        card.classList.contains("tiktok-plus-cinema-card"));
      check("向上切回后仍按整屏对齐", next.getBoundingClientRect().top >= innerHeight - 1);

      feed.scrollBy({ top: innerHeight * 0.7, behavior: "smooth" });
      await until(() => Math.abs(next.getBoundingClientRect().top) <= 1 &&
        !!next.querySelector(".tiktok-plus-cinema-card"));
      check("滚动结束后吸附到一条完整视频", article.getBoundingClientRect().bottom <= 1);
      const rebuiltItem = makeFeedItem(1920, 1080);
      next.replaceWith(rebuiltItem);
      await until(() => !!rebuiltItem.querySelector(".tiktok-plus-cinema-card"));
      check("当前播放器 DOM 重建后重新绑定影院布局", !!rebuiltItem.querySelector(".tiktok-plus-cinema-bar") &&
        rebuiltItem.querySelector("video").getBoundingClientRect().bottom <= innerHeight);
      const oldBar = rebuiltItem.querySelector(".SectionActionBarContainer");
      const newBar = oldBar.cloneNode(true);
      newBar.classList.remove("tiktok-plus-cinema-bar", "tiktok-plus-cinema-chrome");
      oldBar.replaceWith(newBar);
      await until(() => newBar.classList.contains("tiktok-plus-cinema-bar"));
      check("仅替换工具栏时也重新绑定", newBar.classList.contains("tiktok-plus-cinema-chrome"));
      document.querySelector("#next-video").hidden = false;
      document.querySelector("#previous-video").hidden = false;

      const commentRail = document.querySelector("#right-panel");
      commentRail.className = "AsideOneColumnSidebar";
      document.querySelector("#comment-icon").click();
      await frames(6);
      key(document.body, "KeyH", "h");
      await flush();
      check("H 退出全屏并调用 exitFullscreen", calls.at(-1) === "exit" && !document.fullscreenElement);
      check("退出全屏保留已打开的评论并恢复导航侧栏", !commentRail.hidden &&
        getComputedStyle(commentRail).display !== "none" &&
        getComputedStyle(document.querySelector("#navigation-sidebar")).display !== "none");
      commentRail.querySelector("#close-comments").click();
      check("退出后完全清理布局", !cinemaOn() && !card.className.includes("tiktok-plus-cinema") &&
        !bar.className.includes("tiktok-plus-cinema") &&
        !document.querySelector("#video-article").className.includes("tiktok-plus-cinema") &&
        !document.querySelector("#media-card-row").className.includes("tiktok-plus-cinema") &&
        !document.querySelector(".tiktok-plus-cinema-backdrop") &&
        !document.querySelector(".tiktok-plus-cinema-media, .tiktok-plus-cinema-list") &&
        ![...root.style].some(name => name.startsWith("--tiktok-plus-cinema")));
      check("退出后恢复页面原有尺寸与图标颜色", getComputedStyle(card.querySelector(".DivVideoPlayerContainer")).height === "820px" &&
        getComputedStyle(likePath).fill === "rgb(22, 24, 35)");
      check("退出后恢复原行内填色且保留站点新增样式", getComputedStyle(commentSvg).fill === "rgba(22, 24, 35, 0.9)" &&
        commentSvg.style.getPropertyPriority("fill") === "" && commentSvg.style.marginLeft === "2px");
      check("重建工具栏退出后也不残留改色", !document.querySelector('[class*="tiktok-plus-cinema-ink-"]') &&
        [...newBar.querySelectorAll("svg, svg *")].every(node =>
          ["color", "fill", "stroke"].every(name => node.style.getPropertyPriority(name) !== "important")));
      check("退出后仍停留在当前视频", (() => {
        // At the end of the feed scrollTop can clamp before the article reaches the top.
        const rect = rebuiltItem.querySelector("video").getBoundingClientRect();
        const visibleHeight = Math.min(rect.bottom, innerHeight) - Math.max(rect.top, 0);
        return visibleHeight >= Math.min(rect.height, innerHeight) * 0.9;
      })());

      window.__denyFullscreen = true;
      key(document.body, "KeyF", "f");
      await flush();
      check("API 被拒绝时退回点击原生全屏控件", fullscreenControlClicks === 1 && !document.fullscreenElement);
      check("兜底失败后不残留影院布局", !cinemaOn() &&
        !document.querySelector(".tiktok-plus-cinema-backdrop, .tiktok-plus-cinema-card"));
      window.__denyFullscreen = false;

      // Firefox/Safari can exit fullscreen themselves (Escape, OS gesture); the cinema layout
      // must be dropped even when the script did not run the exit itself.
      key(document.body, "KeyF", "f");
      await flush();
      check("再次进入影院模式", cinemaOn() && !!document.fullscreenElement);
      window.__browserExit();
      await flush();
      check("浏览器自行退出时同步清理影院布局", !cinemaOn() && !card.className.includes("tiktok-plus-cinema"));

      const panel = document.querySelector("#bulk-panel");
      const list = document.querySelector("#bulk-comments");
      const batch = Array.from({ length: 8 }, (_, i) =>
        makeComment("Batch comment " + i, list, i % 2 ? 2 : 1));
      panel.hidden = false;
      await flush();
      const bulkButton = () => panel.querySelector(".tiktok-plus-bulk-controls button");
      const bulkStatus = () => panel.querySelector('[role="status"]')?.textContent ?? "";
      check("批量按钮只创建一次", !!bulkButton() &&
        panel.querySelectorAll(".tiktok-plus-bulk-controls").length === 1);
      const batchStart = requests.length;
      bulkButton().click();
      await until(() => requests.length === batchStart + 6);
      check("默认最多并行发起六个请求", requests.length === batchStart + 6 &&
        bulkButton().textContent === "全部查看原文");
      buttonFor(batch[7]).click();
      check("手动触发第八条时不超出并发上限", requests.length === batchStart + 6);
      respond(requests[batchStart], "批量译文 0");
      await until(() => requests.length === batchStart + 7);
      check("空出一个请求槽位后手动任务优先", requestText(requests.at(-1)) === "Batch comment 7");
      const answered = new Set([batchStart]);
      for (let n = 0; n < 30; n++) {
        for (let i = batchStart; i < requests.length; i++) {
          if (answered.has(i)) continue;
          answered.add(i);
          respond(requests[i], "译文：" + requestText(requests[i]));
        }
        await wait(30);
        if (batch.every(comment => !translated(comment).hidden)) break;
      }
      check("八条评论全部翻译并继续处理后续任务",
        batch.every(comment => !translated(comment).hidden));
      await until(() => bulkStatus() === "自动翻译已开启");
      check("所有任务结束后显示等待新评论状态", bulkStatus() === "自动翻译已开启");

      const originalRow = batch[0].parentElement;
      buttonFor(batch[0]).click();
      const replacementRow = originalRow.cloneNode(true);
      replacementRow.querySelector(".tiktok-plus-comment-controls").remove();
      originalRow.replaceWith(replacementRow);
      const replacement = replacementRow.querySelector('[data-e2e="comment-level-1"]');
      await flush();
      check("虚拟化评论重建仍复用译文与原文偏好",
        translated(replacement).hidden && buttonFor(replacement).textContent === "查看译文");

      const added = makeComment("New dynamically loaded reply", list, 2);
      await until(() => requests.some(request => requestText(request) === added.textContent));
      respond(requests.find(request => requestText(request) === added.textContent), "动态回复成功");
      await flush();
      check("新展开的回复自动翻译", !translated(added).hidden);

      const failed = makeComment("Retry a temporary outage");
      await flush();
      const beforeRetry = requests.length;
      buttonFor(failed).click();
      requests.at(-1).ontimeout();
      await until(() => requests.length === beforeRetry + 2, 4);
      respond(requests.at(-1), "重试成功");
      await flush();
      check("暂时超时在退避后最多重试两次", !translated(failed).hidden);

      const late = makeComment("Old video translation");
      await flush();
      buttonFor(late).click();
      const lateRequest = requests.at(-1);
      const oldPath = location.pathname;
      history.replaceState(null, "", "/@example/video/123456789");
      respond(lateRequest, "错误视频译文");
      await flush();
      check("跨视频切换不显示迟到译文",
        translated(late).hidden && buttonFor(late).textContent === "翻译");
      history.replaceState(null, "", oldPath);
      await flush();

      const cooldown = makeComment("Request that receives 429");
      await flush();
      const cooldownStart = requests.length;
      buttonFor(cooldown).click();
      respond(requests.at(-1), "429", 429);
      await flush();
      check("HTTP 429 进入冷却队列而非立即重发", requests.length === cooldownStart + 1);
      const blocked = makeComment("Request while cooldown is active");
      await flush();
      buttonFor(blocked).click();
      await wait(100);
      check("429 冷却期间新评论排队不发送请求",
        requests.length === cooldownStart + 1 && buttonFor(blocked).disabled);

      dispatchEvent(new Event("pagehide"));
      check("持久化缓存写入用户脚本存储", storage.get("tiktok-plus:dict-chrome-ex:v1")
        .some(item => item[1]?.text === "你好 @friend 😭"));
      check("翻译按钮不会吞掉原生 Space 按键", !key(initialButton, "Space", " ").defaultPrevented);
      output.textContent = "通过 " + passed.length + " 项检查\n\n" + passed.join("\n");
    } catch (error) {
      output.textContent = "失败：" + error.message + "\n\n" + passed.join("\n");
      console.error(error);
    }
  })();
</script>
</html>
