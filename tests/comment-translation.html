<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>TikTok Plus 评论翻译测试</title>
<style>
  :root { color-scheme: light dark; --ui-text-1: CanvasText; --ui-text-2: CanvasText; }
  body { max-width: 900px; margin: 32px auto; padding: 0 20px; font: 15px/1.6 system-ui; }
  article { padding: 12px; margin: 8px 0; border: 1px solid GrayText; }
  #results { white-space: pre-wrap; }
  video { position: fixed; top: 12px; right: 12px; width: 200px; height: 80px; }
  #open-comments { position: fixed; top: 100px; right: 12px; }
  #fullscreen { position: fixed; top: 132px; right: 12px; }
  #next-video { position: fixed; top: 164px; right: 12px; }
  #previous-video { position: fixed; top: 196px; right: 12px; }
  #bulk-panel { position: fixed; top: 250px; right: 12px; width: 420px; max-height: 480px; overflow: auto; background: Canvas; border: 1px solid GrayText; }
  #bulk-panel [class="DivCommentHeader"] { display: flex; align-items: center; padding: 8px; }
</style>
<h1>TikTok Plus 评论翻译测试</h1>
<p>自动检查，使用模拟请求，不连接 Google。刷新可重新运行。</p>
<pre id="results" role="status">运行中…</pre>
<div id="comments">
  <article id="initial"><div data-e2e="comment-username-1"><a href="/@example">Example</a></div><span data-e2e="comment-level-1">Hello <a href="/@friend">@friend</a> 😭</span><img alt="照片"><div><button data-e2e="comment-reply-1">回复</button></div></article>
</div>
<section id="bulk-panel" class="SectionCommentSidebarContainer" hidden>
  <div class="DivCommentHeader"><span>评论</span><div class="DivCloseButtonWrapper"><button aria-label="exit">×</button></div></div>
  <div id="bulk-comments"></div>
</section>
<section id="player-card" data-e2e="feed-video" aria-label="Watch in full screen">
  <video></video>
</section>
<button data-e2e="comment-icon" id="open-comments">评论区</button>
<button data-e2e="cinema-mode-entry" id="fullscreen">全屏</button>
<button aria-label="Next" id="next-video">下一个</button>
<button aria-label="Previous" id="previous-video">上一个</button>
<textarea aria-label="评论输入框"></textarea>
<script>
  const requests = [];
  window.GM_xmlhttpRequest = request => {
    request.startedAt = performance.now();
    requests.push(request);
    return { abort() { request.aborted = true; } };
  };
  window.__tiktokRequests = requests;
  const storage = new Map();
  const seedKey = JSON.stringify(["google:dict-chrome-ex:v1", "zh-CN", "Previously translated"]);
  storage.set("tiktok-plus:dict-chrome-ex:v1",
    [[seedKey, { text: "已有缓存译文", expires: Date.now() + 86400000 }]]);
  window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
  window.GM_setValue = (key, value) => storage.set(key, value);
  // Privileged userscripts expose a wrapped window that cannot be used as UIEvent.view.
  const NativeMouseEvent = MouseEvent;
  window.MouseEvent = class extends NativeMouseEvent {
    constructor(type, options = {}) {
      const init = { ...options };
      if (init.view === window) init.view = new Proxy(window, {});
      super(type, init);
    }
  };
  // TikTok's media card is labelled "Watch in full screen" but only toggles playback, so the
  // harness reproduces it to prove the shortcut never treats the card as a fullscreen control.
  window.__cardClicks = 0;
  document.querySelector("#player-card").addEventListener("click", () => window.__cardClicks++);
  // Fake the Fullscreen API so request/exit behaviour is asserted deterministically.
  const fullscreenCalls = [];
  let fakeFullscreenElement = null;
  Object.defineProperty(document, "fullscreenElement", { configurable: true, get: () => fakeFullscreenElement });
  Object.defineProperty(document, "exitFullscreen", {
    configurable: true,
    value: () => {
      fullscreenCalls.push("exit");
      fakeFullscreenElement = null;
      document.dispatchEvent(new Event("fullscreenchange"));
      return Promise.resolve();
    },
  });
  Element.prototype.requestFullscreen = function () {
    fullscreenCalls.push(this);
    if (window.__denyFullscreen) return Promise.reject(new TypeError("Fullscreen request denied"));
    fakeFullscreenElement = this;
    document.dispatchEvent(new Event("fullscreenchange"));
    return Promise.resolve();
  };
  window.__fullscreenCalls = fullscreenCalls;
</script>
<script src="../tiktok_plus.js?v=1.4.1"></script>
<script>
  (async () => {
    const output = document.querySelector("#results");
    const passed = [];
    const requests = window.__tiktokRequests;
    const flush = () => new Promise(resolve => setTimeout(resolve, 0));
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const until = async (predicate, seconds = 5) => {
      const deadline = performance.now() + seconds * 1000;
      while (!predicate()) {
        if (performance.now() >= deadline) throw new Error("等待状态超时");
        await wait(20);
      }
    };
    const check = (name, condition) => {
      if (!condition) throw new Error(name);
      passed.push("✓ " + name);
      output.textContent = passed.join("\n");
    };
    const buttonFor = element => element.parentElement.querySelector(".tiktok-plus-translate-button");
    const translated = element => element.parentElement.querySelector(".tiktok-plus-comment-translation");
    const requestText = request => new URL(request.url).searchParams.get("q");
    const respond = (request, value, status = 200) => request.onload({
      status, responseHeaders: "", responseText: JSON.stringify([[value]]),
    });
    const makeComment = (text, target = document.querySelector("#comments"), level = 1) => {
      const row = document.createElement("article");
      const user = document.createElement("div");
      user.dataset.e2e = "comment-username-" + level;
      const anchor = document.createElement("a");
      anchor.href = "/@example"; anchor.textContent = "Example"; user.append(anchor);
      const element = document.createElement("span");
      element.dataset.e2e = "comment-level-" + level;
      element.textContent = text;
      row.append(user, element); target.append(row);
      return element;
    };
    const key = (target, code, value) => {
      const event = new KeyboardEvent("keydown", { code, key: value, bubbles: true, cancelable: true });
      target.dispatchEvent(event); return event;
    };
    try {
      const initial = document.querySelector('#initial [data-e2e="comment-level-1"]');
      const originalLink = initial.querySelector("a");
      const initialButton = buttonFor(initial);
      check("安装脚本不自动发送翻译请求", requests.length === 0);
      check("每条评论仅注入一个翻译按钮", !!initialButton &&
        initial.parentElement.querySelectorAll(".tiktok-plus-translate-button").length === 1);
      initialButton.click();
      check("手动翻译立即派发一个请求", requests.length === 1 && initialButton.disabled);
      const googleUrl = new URL(requests[0].url);
      check("与 Forum Translator 使用相同的 Google 接口", googleUrl.pathname === "/translate_a/t" &&
        googleUrl.searchParams.get("client") === "dict-chrome-ex" &&
        googleUrl.searchParams.get("tl") === "zh-CN" && requests[0].anonymous === true &&
        requests[0].timeout === 25000);
      respond(requests[0], "你好 @friend 😭");
      await flush();
      check("翻译后原文可恢复且保留原生链接", translated(initial).textContent === "你好 @friend 😭" &&
        initial.classList.contains("tiktok-plus-original-hidden"));
      initialButton.click();
      check("恢复原文后原生链接依旧可用", !initial.classList.contains("tiktok-plus-original-hidden") &&
        initial.querySelector("a") === originalLink);
      initialButton.click();
      check("重复切换译文不再次请求", requests.length === 1 && !translated(initial).hidden);

      const cached = makeComment("Previously translated");
      await flush();
      const beforeCache = requests.length;
      buttonFor(cached).click();
      await flush();
      check("启动时加载 30 天持久化缓存", translated(cached).textContent === "已有缓存译文" &&
        requests.length === beforeCache);
      const sameA = makeComment("Identical comment with duplicate requester");
      const sameB = makeComment("Identical comment with duplicate requester");
      await flush();
      const beforeDedup = requests.length;
      buttonFor(sameA).click(); buttonFor(sameB).click();
      check("两个独立评论共享同一网络请求", requests.length === beforeDedup + 1);
      respond(requests.at(-1), "复用同一个请求");
      await flush();
      check("请求去重仍分别更新两个评论", !translated(sameA).hidden && !translated(sameB).hidden);

      const longText = "A".repeat(899) + "😀" + "B".repeat(950);
      const longComment = makeComment(longText);
      await flush();
      const longStart = requests.length;
      buttonFor(longComment).click();
      check("超过900字符拆分为3个请求", requests.length === longStart + 3 &&
        requests.slice(longStart).every(request => requestText(request).length <= 900));
      check("分段边界不会截断Emoji", requests.slice(longStart).some(request =>
        requestText(request).includes("😀")) &&
        requests.slice(longStart).every(request => !requestText(request).includes("�")));
      for (let i = longStart; i < requests.length; i++) respond(requests[i], "译文块" + (i - longStart));
      await flush();
      check("分段结果拼接回同一条评论", translated(longComment).textContent === "译文块0译文块1译文块2");

      const emoji = makeComment("🤩🔥");
      await flush();
      check("纯表情评论不会注入翻译入口", !buttonFor(emoji));
      const injection = makeComment("Return dangerous HTML");
      await flush();
      buttonFor(injection).click();
      respond(requests.at(-1), '<img src=x onerror="alert(1)">');
      await flush();
      check("译文按文本渲染，不执行 HTML", translated(injection).children.length === 0);

      const calls = window.__fullscreenCalls;
      const card = document.querySelector("#player-card");
      let fullscreenControlClicks = 0;
      document.querySelector("#fullscreen").addEventListener("click", () => fullscreenControlClicks++);
      const clickedControl = () => window.__cardClicks === 0 && fullscreenControlClicks === 0;
      key(document.body, "KeyF", "f");
      await flush();
      check("F 通过 Fullscreen API 进入播放器全屏", calls.length === 1 && calls[0] === card &&
        card.classList.contains("tiktok-plus-fs-card"));
      check("进入全屏不点击媒体卡片或旧影院控件", document.fullscreenElement === card && clickedControl());
      key(document.body, "KeyH", "h");
      await flush();
      check("H 退出全屏并调用 exitFullscreen", calls.length === 2 && calls[1] === "exit" &&
        !document.fullscreenElement);
      check("退出后清理布局类", !card.className.includes("tiktok-plus-fs-"));

      window.__denyFullscreen = true;
      key(document.body, "KeyF", "f");
      await flush();
      check("API 被拒绝时退回点击原生全屏控件", fullscreenControlClicks === 1 && !document.fullscreenElement);
      check("兜底失败后不残留布局类", !document.querySelector(".tiktok-plus-fs-card, .tiktok-plus-fs-video"));
      window.__denyFullscreen = false;

      // Firefox/Safari can exit fullscreen themselves (Escape, OS gesture); the layout classes
      // must be dropped even when the script did not run the exit itself.
      card.classList.add("tiktok-plus-fs-card");
      document.dispatchEvent(new Event("fullscreenchange"));
      await flush();
      check("浏览器自行退出时同步清理布局类", !card.className.includes("tiktok-plus-fs-"));

      const panel = document.querySelector("#bulk-panel");
      const list = document.querySelector("#bulk-comments");
      const batch = Array.from({ length: 8 }, (_, i) =>
        makeComment("Batch comment " + i, list, i % 2 ? 2 : 1));
      panel.hidden = false;
      await flush();
      const bulkButton = () => panel.querySelector(".tiktok-plus-bulk-controls button");
      const bulkStatus = () => panel.querySelector('[role="status"]')?.textContent ?? "";
      check("批量按钮只创建一次", !!bulkButton() &&
        panel.querySelectorAll(".tiktok-plus-bulk-controls").length === 1);
      const batchStart = requests.length;
      bulkButton().click();
      await until(() => requests.length === batchStart + 6);
      check("默认最多并行发起六个请求", requests.length === batchStart + 6 &&
        bulkButton().textContent === "全部查看原文");
      buttonFor(batch[7]).click();
      check("手动触发第八条时不超出并发上限", requests.length === batchStart + 6);
      respond(requests[batchStart], "批量译文 0");
      await until(() => requests.length === batchStart + 7);
      check("空出一个请求槽位后手动任务优先", requestText(requests.at(-1)) === "Batch comment 7");
      const answered = new Set([batchStart]);
      for (let n = 0; n < 30; n++) {
        for (let i = batchStart; i < requests.length; i++) {
          if (answered.has(i)) continue;
          answered.add(i);
          respond(requests[i], "译文：" + requestText(requests[i]));
        }
        await wait(30);
        if (batch.every(comment => !translated(comment).hidden)) break;
      }
      check("八条评论全部翻译并继续处理后续任务",
        batch.every(comment => !translated(comment).hidden));
      await until(() => bulkStatus() === "自动翻译已开启");
      check("所有任务结束后显示等待新评论状态", bulkStatus() === "自动翻译已开启");

      const originalRow = batch[0].parentElement;
      buttonFor(batch[0]).click();
      const replacementRow = originalRow.cloneNode(true);
      replacementRow.querySelector(".tiktok-plus-comment-controls").remove();
      originalRow.replaceWith(replacementRow);
      const replacement = replacementRow.querySelector('[data-e2e="comment-level-1"]');
      await flush();
      check("虚拟化评论重建仍复用译文与原文偏好",
        translated(replacement).hidden && buttonFor(replacement).textContent === "查看译文");

      const added = makeComment("New dynamically loaded reply", list, 2);
      await until(() => requests.some(request => requestText(request) === added.textContent));
      respond(requests.find(request => requestText(request) === added.textContent), "动态回复成功");
      await flush();
      check("新展开的回复自动翻译", !translated(added).hidden);

      const failed = makeComment("Retry a temporary outage");
      await flush();
      const beforeRetry = requests.length;
      buttonFor(failed).click();
      requests.at(-1).ontimeout();
      await until(() => requests.length === beforeRetry + 2, 4);
      respond(requests.at(-1), "重试成功");
      await flush();
      check("暂时超时在退避后最多重试两次", !translated(failed).hidden);

      const late = makeComment("Old video translation");
      await flush();
      buttonFor(late).click();
      const lateRequest = requests.at(-1);
      const oldPath = location.pathname;
      history.replaceState(null, "", "/@example/video/123456789");
      respond(lateRequest, "错误视频译文");
      await flush();
      check("跨视频切换不显示迟到译文",
        translated(late).hidden && buttonFor(late).textContent === "翻译");
      history.replaceState(null, "", oldPath);
      await flush();

      const cooldown = makeComment("Request that receives 429");
      await flush();
      const cooldownStart = requests.length;
      buttonFor(cooldown).click();
      respond(requests.at(-1), "429", 429);
      await flush();
      check("HTTP 429 进入冷却队列而非立即重发", requests.length === cooldownStart + 1);
      const blocked = makeComment("Request while cooldown is active");
      await flush();
      buttonFor(blocked).click();
      await wait(100);
      check("429 冷却期间新评论排队不发送请求",
        requests.length === cooldownStart + 1 && buttonFor(blocked).disabled);

      dispatchEvent(new Event("pagehide"));
      check("持久化缓存写入用户脚本存储", storage.get("tiktok-plus:dict-chrome-ex:v1")
        .some(item => item[1]?.text === "你好 @friend 😭"));
      check("翻译按钮不会吞掉原生 Space 按键", !key(initialButton, "Space", " ").defaultPrevented);
      output.textContent = "通过 " + passed.length + " 项检查\n\n" + passed.join("\n");
    } catch (error) {
      output.textContent = "失败：" + error.message + "\n\n" + passed.join("\n");
      console.error(error);
    }
  })();
</script>
</html>
